<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tech Video Hub{% endblock %}</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="/static/css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script defer src="/static/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">IT</span>
      <span>Tech Video Hub</span>
    </a>
    <form class="search" action="/" method="get">
      <i data-lucide="search"></i>
      <input name="q" value="{{ q | default('') }}" placeholder="Search tech videos, keywords, playlists">
    </form>
    <nav class="nav-actions">
      <a href="/videos">Videos</a>
      <a class="button ghost" href="/admin">Owner</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
