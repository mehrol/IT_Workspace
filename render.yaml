services:
  - type: web
    name: tech-video-hub
    runtime: python:3.11
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AUTO_CREATE_DATABASE
        value: "true"
      - key: PORT
        value: 8000
